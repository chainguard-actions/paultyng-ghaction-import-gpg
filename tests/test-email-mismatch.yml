name: Test committer email mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Load test key into env
        run: |
          {
            echo "GPG_PRIVATE_KEY<<EOF_GPG_KEY"
            cat "$GITHUB_WORKSPACE/.github/test-key.pgp"
            echo ""
            echo "EOF_GPG_KEY"
            echo "PASSPHRASE=$(cat "$GITHUB_WORKSPACE/.github/test-key.pass")"
          } >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          git_user_signingkey: 'true'
          git_committer_email: 'someone-else@example.com'
      - name: Assert action failed but outputs were set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINGERPRINT: ${{ steps.action.outputs.fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "fingerprint: $FINGERPRINT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on email mismatch"; exit 1
          fi
          if [ "$FINGERPRINT" != "27571A53B86AF0C799B38BA77D851EB72D73BDA0" ]; then
            echo "FAIL: fingerprint output should be set before mismatch check"; exit 1
          fi
          actual="$(git config --local --get user.email || true)"
          echo "user.email = '$actual'"
          if [ "$actual" = "someone-else@example.com" ]; then
            echo "FAIL: mismatched email should not be configured"; exit 1
          fi
          echo "PASS"
