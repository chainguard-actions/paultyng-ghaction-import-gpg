name: Test missing private key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINGERPRINT: ${{ steps.action.outputs.fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without GPG_PRIVATE_KEY"; exit 1
          fi
          if [ -n "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint should be empty"; exit 1
          fi
          echo "PASS"
